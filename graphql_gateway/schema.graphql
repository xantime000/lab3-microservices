"""Сущность заказа пользователя"""
type Order {
  """Уникальный идентификатор заказа"""
  id: ID!

  """Идентификатор пользователя, оформившего заказ"""
  userId: ID!

  """Дата и время создания заказа в формате ISO 8601"""
  createdAt: String!

  """Список позиций (товаров) в заказе"""
  items: [OrderItem!]!
}

"""Элемент заказа, связывающий товар и его количество"""
type OrderItem {
  """Количество единиц товара в заказе"""
  quantity: Int!

  """Информация о товаре, загружаемая через DataLoader без проблемы N+1"""
  product: Product!
}

"""Сущность товара из сервиса каталога"""
type Product {
  """Уникальный идентификатор товара"""
  id: ID!

  """Наименование товара"""
  name: String!

  """Стоимость товара в рублях"""
  price: Float!
}

"""Корневые запросы GraphQL Gateway"""
type Query {
  """
  Получение всех заказов пользователя с деталями товаров (агрегация Order + Catalog)
  """
  ordersByUserId(userId: ID!): [Order!]!
}