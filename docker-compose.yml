version: '3.8'

services:
  # 1. Сервис аутентификации (REST API)
  auth:
    build:
      context: ./auth_service
    container_name: lab3-auth
    environment:
      - PORT=5001
    ports:
      - "5001:5001"
    networks:
      - lab3-network

  # 2. Сервис каталога товаров (REST API)
  catalog:
    build:
      context: ./catalog_service
    container_name: lab3-catalog
    environment:
      - PORT=5002
    ports:
      - "5002:5002"
    networks:
      - lab3-network

  # 3. Сервис заказов (REST API)
  order:
    build:
      context: ./order_service
    container_name: lab3-order
    environment:
      - PORT=5003
    ports:
      - "5003:5003"
    networks:
      - lab3-network

  # 4. GraphQL Gateway (шлюз и DataLoader)
  graphql-gateway:
    build:
      context: ./graphql_gateway
    container_name: lab3-graphql-gateway
    environment:
      - PORT=5004
      - ORDER_SERVICE_URL=http://order:5003
      - CATALOG_SERVICE_URL=http://catalog:5002
    ports:
      - "5004:5004"
    depends_on:
      - catalog
      - order
    networks:
      - lab3-network

  # 5. Nginx API Gateway (единая точка входа)
  nginx:
    image: nginx:alpine
    container_name: lab3-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "8080:80"
    depends_on:
      - auth
      - catalog
      - order
      - graphql-gateway
    networks:
      - lab3-network

networks:
  lab3-network:
    driver: bridge
