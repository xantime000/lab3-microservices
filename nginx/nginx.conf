events {
    worker_connections 1024;
}

http {
    upstream auth_backend {
        server auth:5001;
    }

    upstream catalog_backend {
        server catalog:5002;
    }

    upstream order_backend {
        server order:5003;
    }

    upstream graphql_backend {
        server graphql-gateway:5004;
    }

    server {
        listen 80;

        # 1. Маршрутизация REST API для Auth Service
        location /api/auth/ {
            proxy_pass http://auth_backend/api/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 2. Маршрутизация REST API для Catalog Service
        location /api/catalog/ {
            proxy_pass http://catalog_backend/api/catalog/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 3. Маршрутизация REST API для Order Service
        location /api/orders {
            proxy_pass http://order_backend/api/orders;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 4. Маршрутизация к GraphQL Gateway (Query, Mutation, GraphiQL IDE)
        location /graphql {
            proxy_pass http://graphql_backend/graphql;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /playground {
            proxy_pass http://graphql_backend/playground;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 5. Интерактивная документация Swagger UI
        location /docs/auth {
            proxy_pass http://auth_backend/docs;
        }
        location /docs/catalog {
            proxy_pass http://catalog_backend/docs;
        }

        # 6. Главная страница со ссылками на все сервисы и Playground
        location / {
            default_type text/html;
            return 200 '<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Лабораторная работа №3: REST + GraphQL</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 40px; }
        .card { background: #1e293b; border-radius: 12px; padding: 24px; max-width: 800px; margin: 0 auto; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h1 { color: #38bdf8; margin-top: 0; }
        h2 { color: #94a3b8; font-size: 1.1rem; border-bottom: 1px solid #334155; padding-bottom: 8px; }
        ul { list-style: none; padding: 0; }
        li { margin: 12px 0; }
        a { color: #38bdf8; text-decoration: none; font-weight: 500; font-size: 1.05rem; }
        a:hover { text-decoration: underline; }
        .badge { background: #0284c7; color: white; padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; margin-left: 8px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Лабораторная работа №3</h1>
        <p>Документирование и интеграция REST + GraphQL Gateway</p>
        
        <h2>GraphQL Gateway & Playground</h2>
        <ul>
            <li><a href="/graphql" target="_blank">GraphQL Playground / GraphiQL IDE</a> <span class="badge">GraphQL</span></li>
        </ul>

        <h2>REST API эндпоинты</h2>
        <ul>
            <li><a href="/api/catalog/products" target="_blank">Список товаров с пагинацией (/api/catalog/products)</a> <span class="badge">REST</span></li>
            <li><a href="/api/catalog/products/1" target="_blank">Товар по ID (/api/catalog/products/1)</a> <span class="badge">REST</span></li>
            <li><a href="/api/orders?userId=123" target="_blank">Заказы пользователя (/api/orders?userId=123)</a> <span class="badge">REST</span></li>
        </ul>

        <h2>Документация OpenAPI / Swagger UI</h2>
        <ul>
            <li><a href="/docs/auth" target="_blank">Swagger UI: Auth Service (/docs/auth)</a></li>
            <li><a href="/docs/catalog" target="_blank">Swagger UI: Catalog Service (/docs/catalog)</a></li>
        </ul>
    </div>
</body>
</html>';
        }
    }
}
